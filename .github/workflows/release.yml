name: Release Cottonfall

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate module manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("module.json", encoding="utf-8") as f:
              module = json.load(f)

          tag = os.environ["GITHUB_REF_NAME"]
          version = module["version"]

          assert module["id"] == "cottonfall"
          assert tag == f"v{version}", (
              f"Tag {tag} does not match module version {version}"
          )

          print(f"Validated Cottonfall {version}")
          PY

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/cottonfall

          cp module.json README.md LICENSE CREDITS.md dist/cottonfall/

          cp -a assets images packs scripts styles templates dist/cottonfall/
          
          cd dist
          zip -r "cottonfall-v${VERSION}.zip" cottonfall \
            -x '*/LOCK' '*/LOG' '*/LOG.old' '*.log' \
               '*/.gitignore' '*/.gitattributes' '*/.github/*' 
         
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            "dist/cottonfall-v${GITHUB_REF_NAME#v}.zip" \
            "module.json" \
            --title "Cottonfall ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
